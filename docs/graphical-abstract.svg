<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1420" width="2400" height="1420" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-labelledby="t d">
<title id="t">Blueprint Takeoff Estimator API: graphical abstract</title>
<desc id="d">Inputs (scope text, PDF drawings, scanned sheets and photos, DXF/DWG, optional vision) pass through five processing steps (detect, read, understand, reconcile, price) to a quantity takeoff, a priced estimate and review flags.</desc>
<rect width="2400" height="1420" fill="#f6f8fb"/>
<text x="1200.0" y="62" font-size="62" fill="#1b2a41" font-weight="700" text-anchor="middle" dominant-baseline="central">Blueprint Takeoff Estimator API</text>
<text x="1200.0" y="122" font-size="31" fill="#5b6b82" text-anchor="middle" dominant-baseline="central">From construction documents to an auditable quantity takeoff and a priced estimate</text>
<rect x="60" y="170" width="590" height="52" rx="26" fill="#2f6fdb"/>
<text x="355.0" y="196" font-size="30" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">INPUTS</text>
<rect x="770" y="170" width="870" height="52" rx="26" fill="#12907f"/>
<text x="1205.0" y="196" font-size="30" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">PROCESSING</text>
<rect x="1760" y="170" width="580" height="52" rx="26" fill="#d9820f"/>
<text x="2050.0" y="196" font-size="30" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">OUTPUTS</text>
<rect x="60" y="250" width="590" height="168" rx="22" fill="#e8f0fd" stroke="#2f6fdb" stroke-width="3"/>
<rect x="60" y="250" width="14" height="168" rx="7" fill="#2f6fdb"/>
<text x="98" y="299.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Scope text</text>
<text x="98" y="342.5" font-size="25" fill="#5b6b82" text-anchor="start">"1,500 sq ft flooring, 120 LF walls,</text>
<text x="98" y="376.5" font-size="25" fill="#5b6b82" text-anchor="start">four doors"</text>
<rect x="60" y="442" width="590" height="168" rx="22" fill="#e8f0fd" stroke="#2f6fdb" stroke-width="3"/>
<rect x="60" y="442" width="14" height="168" rx="7" fill="#2f6fdb"/>
<text x="98" y="491.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">PDF drawing</text>
<text x="98" y="534.5" font-size="25" fill="#5b6b82" text-anchor="start">Text layer, door schedules,</text>
<text x="98" y="568.5" font-size="25" fill="#5b6b82" text-anchor="start">scale notes, vector geometry</text>
<rect x="60" y="634" width="590" height="168" rx="22" fill="#e8f0fd" stroke="#2f6fdb" stroke-width="3"/>
<rect x="60" y="634" width="14" height="168" rx="7" fill="#2f6fdb"/>
<text x="98" y="683.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Scanned sheet or photo</text>
<text x="98" y="726.5" font-size="25" fill="#5b6b82" text-anchor="start">Image-only pages, site photos,</text>
<text x="98" y="760.5" font-size="25" fill="#5b6b82" text-anchor="start">sideways or skewed scans</text>
<rect x="60" y="826" width="590" height="168" rx="22" fill="#e8f0fd" stroke="#2f6fdb" stroke-width="3"/>
<rect x="60" y="826" width="14" height="168" rx="7" fill="#2f6fdb"/>
<text x="98" y="875.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">DXF / DWG drawing</text>
<text x="98" y="918.5" font-size="25" fill="#5b6b82" text-anchor="start">Layers, blocks, units, room schedule</text>
<text x="98" y="952.5" font-size="25" fill="#5b6b82" text-anchor="start">(DWG needs a converter)</text>
<rect x="60" y="1018" width="590" height="168" rx="22" fill="#e8f0fd" stroke="#2f6fdb" stroke-width="3"/>
<rect x="60" y="1018" width="14" height="168" rx="7" fill="#2f6fdb"/>
<text x="98" y="1067.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Images inside drawings</text>
<text x="98" y="1110.5" font-size="25" fill="#5b6b82" text-anchor="start">Symbols and notes OCR cannot read</text>
<text x="98" y="1144.5" font-size="25" fill="#5b6b82" text-anchor="start">Claude vision, opt-in per request</text>
<rect x="504.8" y="1032" width="127.2" height="32" rx="16" fill="#2f6fdb"/>
<text x="568.4" y="1048" font-size="18" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">OPTIONAL</text>
<rect x="770" y="250" width="870" height="168" rx="22" fill="#e4f6f3" stroke="#12907f" stroke-width="3"/>
<circle cx="830" cy="308" r="30" fill="#12907f"/>
<text x="830" y="308" font-size="34" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="884" y="301.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Detect file type</text>
<text x="884" y="346.5" font-size="25" fill="#5b6b82" text-anchor="start">From the file's content, not its name;</text>
<text x="884" y="380.5" font-size="25" fill="#5b6b82" text-anchor="start">reject unreadable or oversized files</text>
<polygon points="830,442 816,420 844,420" fill="#12907f"/>
<rect x="770" y="442" width="870" height="168" rx="22" fill="#e4f6f3" stroke="#12907f" stroke-width="3"/>
<circle cx="830" cy="500" r="30" fill="#12907f"/>
<text x="830" y="500" font-size="34" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text x="884" y="493.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Read it</text>
<text x="884" y="538.5" font-size="25" fill="#5b6b82" text-anchor="start">Text layer  |  OCR (RapidOCR, deskew)</text>
<text x="884" y="572.5" font-size="25" fill="#5b6b82" text-anchor="start">CAD layers, nested blocks, arrays</text>
<polygon points="830,634 816,612 844,612" fill="#12907f"/>
<rect x="770" y="634" width="870" height="168" rx="22" fill="#e4f6f3" stroke="#12907f" stroke-width="3"/>
<circle cx="830" cy="692" r="30" fill="#12907f"/>
<text x="830" y="692" font-size="34" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="884" y="685.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Understand</text>
<text x="884" y="730.5" font-size="25" fill="#5b6b82" text-anchor="start">Unit-aware quantities, dimensions, scale</text>
<text x="884" y="764.5" font-size="25" fill="#5b6b82" text-anchor="start">Walls, door swings, rooms, schedules</text>
<polygon points="830,826 816,804 844,804" fill="#12907f"/>
<rect x="770" y="826" width="870" height="168" rx="22" fill="#e4f6f3" stroke="#12907f" stroke-width="3"/>
<circle cx="830" cy="884" r="30" fill="#12907f"/>
<text x="830" y="884" font-size="34" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="884" y="877.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Reconcile and label</text>
<text x="884" y="922.5" font-size="25" fill="#5b6b82" text-anchor="start">Pick the best source, flag conflicts</text>
<text x="884" y="956.5" font-size="25" fill="#5b6b82" text-anchor="start">Tag basis, confidence, evidence</text>
<polygon points="830,1018 816,996 844,996" fill="#12907f"/>
<rect x="770" y="1018" width="870" height="168" rx="22" fill="#e4f6f3" stroke="#12907f" stroke-width="3"/>
<circle cx="830" cy="1076" r="30" fill="#12907f"/>
<text x="830" y="1076" font-size="34" fill="white" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<text x="884" y="1069.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Price it</text>
<text x="884" y="1114.5" font-size="25" fill="#5b6b82" text-anchor="start">Rates x quantities, unit check</text>
<text x="884" y="1148.5" font-size="25" fill="#5b6b82" text-anchor="start">Waste, region, overhead, profit, tax</text>
<rect x="1760" y="250" width="580" height="410" rx="22" fill="#fdf1df" stroke="#d9820f" stroke-width="3"/>
<rect x="1760" y="250" width="14" height="410" rx="7" fill="#d9820f"/>
<text x="1798" y="299.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Quantity takeoff</text>
<text x="1798" y="354.1" font-size="27" fill="#1b2a41" font-weight="700" text-anchor="start">walls</text>
<text x="2310" y="354.1" font-size="27" fill="#1b2a41" text-anchor="end">120 LF</text>
<text x="1798" y="400.1" font-size="27" fill="#1b2a41" font-weight="700" text-anchor="start">doors</text>
<text x="2310" y="400.1" font-size="27" fill="#1b2a41" text-anchor="end">4 each</text>
<text x="1798" y="446.1" font-size="27" fill="#1b2a41" font-weight="700" text-anchor="start">flooring</text>
<text x="2310" y="446.1" font-size="27" fill="#1b2a41" text-anchor="end">1,500 SF</text>
<line x1="1798" y1="482" x2="2310" y2="482" stroke="#d9820f" stroke-width="2"/>
<text x="1798" y="517.7" font-size="24" fill="#5b6b82" text-anchor="start">every item carries:</text>
<text x="1798" y="554.9" font-size="23" fill="#d9820f" font-weight="700" text-anchor="start">basis:</text>
<text x="1948" y="554.0" font-size="22" fill="#5b6b82" text-anchor="start">text | schedule | geometry | cad | vision</text>
<text x="1798" y="586.9" font-size="23" fill="#d9820f" font-weight="700" text-anchor="start">confidence:</text>
<text x="1948" y="586.0" font-size="22" fill="#5b6b82" text-anchor="start">high | medium | low</text>
<text x="1798" y="618.9" font-size="23" fill="#d9820f" font-weight="700" text-anchor="start">evidence:</text>
<text x="1948" y="618.0" font-size="22" fill="#5b6b82" text-anchor="start">the text or entities it came from</text>
<rect x="1760" y="684" width="580" height="262" rx="22" fill="#fdf1df" stroke="#d9820f" stroke-width="3"/>
<rect x="1760" y="684" width="14" height="262" rx="7" fill="#d9820f"/>
<text x="1798" y="733.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Priced estimate</text>
<text x="1798" y="776.5" font-size="25" fill="#5b6b82" text-anchor="start">Line items: material, labor hours</text>
<text x="1798" y="810.5" font-size="25" fill="#5b6b82" text-anchor="start">Subtotal, margin, overhead, profit,</text>
<text x="1798" y="844.5" font-size="25" fill="#5b6b82" text-anchor="start">contingency, tax</text>
<text x="1798" y="878.5" font-size="25" fill="#5b6b82" text-anchor="start">Total</text>
<rect x="1760" y="970" width="580" height="216" rx="22" fill="#fdf1df" stroke="#d9820f" stroke-width="3"/>
<rect x="1760" y="970" width="14" height="216" rx="7" fill="#d9820f"/>
<text x="1798" y="1019.9" font-size="34" fill="#1b2a41" font-weight="700" text-anchor="start">Review flags</text>
<text x="1798" y="1062.5" font-size="25" fill="#5b6b82" text-anchor="start">needs_review + warnings:</text>
<text x="1798" y="1096.5" font-size="25" fill="#5b6b82" text-anchor="start">scanned pages, scale, page caps,</text>
<text x="1798" y="1130.5" font-size="25" fill="#5b6b82" text-anchor="start">low OCR confidence</text>
<line x1="655" y1="718.0" x2="739" y2="718.0" stroke="#5b6b82" stroke-width="8"/>
<polygon points="765,718.0 739,701.9 739,734.1" fill="#5b6b82"/>
<line x1="1645" y1="718.0" x2="1729" y2="718.0" stroke="#5b6b82" stroke-width="8"/>
<polygon points="1755,718.0 1729,701.9 1729,734.1" fill="#5b6b82"/>
<line x1="60" y1="1230" x2="2340" y2="1230" stroke="#cfd8e6" stroke-width="2"/>
<text x="1200.0" y="1270" font-size="26" fill="#1b2a41" text-anchor="middle" dominant-baseline="central">Built with FastAPI, ezdxf, pdfplumber, RapidOCR and Pillow. Anything it cannot read is reported, never hidden.</text>
<text x="1200.0" y="1312" font-size="23" fill="#5b6b82" text-anchor="middle" dominant-baseline="central">Status: the rate table is a 3-category sample  |  OCR accuracy measured on synthetic scans  |  geometry is heuristic and needs a stated scale</text>
</svg>