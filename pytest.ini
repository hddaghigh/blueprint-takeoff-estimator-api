[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    ocr_engine: needs the real Tesseract binary (run: pytest -m ocr_engine)
# Real-engine OCR tests are opt-in so the default suite is identical with or
# without Tesseract installed. Run them before any release: pytest -m ocr_engine
addopts = -m "not ocr_engine"
